name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Build all platforms
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/croctui-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/croctui-windows-arm64.exe .
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/croctui-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/croctui-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o dist/croctui-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/croctui-darwin-arm64 .
          ls -lh dist/
          sha256sum dist/* > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
